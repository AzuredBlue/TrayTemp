[package]
name = "traytemp"
version = "0.1.1"
edition = "2021"
license = "MIT"

[dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell",
  "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Power",
  "Win32_System_Threading", "Win32_Security", "Win32_System_Registry",
  "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices",
  "Wdk_Graphics_Direct3D", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Com",
  "Win32_Networking_WinHttp", "Win32_Security_WinTrust", "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
  "Win32_Globalization", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
