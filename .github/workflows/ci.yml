name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Do not set RUSTFLAGS or CARGO_ENCODED_RUSTFLAGS anywhere: they replace the rustflags in
      # .cargo/config.toml (static VC runtime, OS UCRT) and the exe would need VCRUNTIME140.dll again.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release
      - name: Report size and runtime imports (informational)
        shell: pwsh
        run: |
          $exe = 'target/release/traytemp.exe'
          $size = (Get-Item $exe).Length
          "Windows exe: $size bytes ($([math]::Round($size / 1KB, 1)) KiB). Internal goal: under 600 KB." | Add-Content $env:GITHUB_STEP_SUMMARY
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($text.Contains('VCRUNTIME140.dll')) {
            Write-Host '::warning::traytemp.exe imports VCRUNTIME140.dll (the static CRT setup in .cargo/config.toml may not be applied)'
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traytemp-windows-x86_64
          path: target/release/traytemp.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - run: cargo install cargo-zigbuild --locked --version 0.24.1
      - name: Release build against glibc 2.28
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28
      - name: Report size (informational)
        run: |
          size=$(stat -c %s target/x86_64-unknown-linux-gnu/release/traytemp)
          echo "Linux binary: $size bytes ($((size / 1024)) KiB). Internal goal: under 4 MB." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traytemp-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/traytemp
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp dist/traytemp-windows-x86_64/traytemp.exe release/traytemp.exe
          cp dist/traytemp-linux-x86_64/traytemp release/traytemp-linux-x86_64
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes release/*
